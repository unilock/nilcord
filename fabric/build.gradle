plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven {
        name = 'Nucleoid'
        url = 'https://maven.nucleoid.xyz/'
    }
    maven {
        name = 'Sleeping Town'
        url = 'https://repo.sleeping.town/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    implementation include("folk.sisby:kaleido-config:${kaleido_version}")
    implementation include("eu.pb4:placeholder-api:${papi_fabric_version}")

    implementation include("net.dv8tion:JDA:${jda_version}") {
        exclude module: 'opus-java'
    }
    include('com.fasterxml.jackson.core:jackson-core:2.21.2')
    include('com.fasterxml.jackson.core:jackson-annotations:2.21')
    include('com.fasterxml.jackson.core:jackson-databind:2.21.2')
    include('com.neovisionaries:nv-websocket-client:2.14')
    include('com.squareup.okhttp3:okhttp:5.3.2')
    include('com.squareup.okio:okio-jvm:3.17.0')
    include('net.sf.trove4j:core:3.1.0')
    include('org.apache.commons:commons-collections4:4.5.0')
    include('org.jetbrains.kotlin:kotlin-stdlib:1.9.25')
    include('org.slf4j:slf4j-api:2.0.17')
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
