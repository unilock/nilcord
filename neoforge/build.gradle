plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

repositories {
    maven {
        name = 'OffsetMonkey538'
        url = 'https://maven.offsetmonkey538.top/releases/'
    }
    maven {
        name = 'Sleeping Town'
        url = 'https://repo.sleeping.town/'
    }
}

dependencies {
    jarJar(implementation(group: 'folk.sisby', name: 'kaleido-config')) {
        version {
            prefer kaleido_version
        }
    }
    jarJar(implementation(group: 'eu.pb4', name: 'placeholder-api-neoforge')) {
        version {
            prefer papi_neoforge_version
        }
    }

    jarJar(implementation(group: 'net.dv8tion', name: 'JDA')) {
        version {
            prefer jda_version
        }
        exclude module: 'opus-java'
    }
    jarJar(group: 'com.fasterxml.jackson.core', name: 'jackson-core') {
        version {
            prefer '2.21.2'
        }
    }
    jarJar(group: 'com.fasterxml.jackson.core', name: 'jackson-annotations') {
        version {
            prefer '2.21'
        }
    }
    jarJar(group: 'com.fasterxml.jackson.core', name: 'jackson-databind') {
        version {
            prefer '2.21.2'
        }
    }
    jarJar(group: 'com.neovisionaries', name: 'nv-websocket-client') {
        version {
            prefer '2.14'
        }
    }
    jarJar(group: 'com.squareup.okhttp3', name: 'okhttp') {
        version {
            prefer '5.3.2'
        }
    }
    jarJar(group: 'com.squareup.okio', name: 'okio-jvm') {
        version {
            prefer '3.17.0'
        }
    }
    jarJar(group: 'net.sf.trove4j', name: 'core') {
        version {
            prefer '3.1.0'
        }
    }
    jarJar(group: 'org.apache.commons', name: 'commons-collections4') {
        version {
            prefer '4.5.0'
        }
    }
    jarJar(group: 'org.jetbrains.kotlin', name: 'kotlin-stdlib') {
        version {
            prefer '1.9.25'
        }
    }
    jarJar(group: 'org.slf4j', name: 'slf4j-api') {
        version {
            prefer '2.0.17'
        }
    }
}

neoForge {
    version = neoforge_version
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
        }
        data {
            clientData()
            gameDirectory = this.mkdir(this.file('runs/data'))
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
            this.file('runs/server').createParentDirectories()
            gameDirectory = this.mkdir(this.file('runs/server'))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
