plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = "${version}+${minecraft_version_base}+fabric"

loom {
	mods {
		'nilcord' {
			sourceSet('main')
		}
	}
}

repositories {
	maven {
		name = 'Nucleoid'
		url = 'https://maven.nucleoid.xyz/'
	}
	maven {
		name = 'Sleeping Town'
		url = 'https://repo.sleeping.town/'
	}
	mavenCentral()
}

dependencies {
	minecraft("com.mojang:minecraft:${minecraft_version}")
	mappings("net.fabricmc:yarn:${yarn_mappings}:v2")
	modImplementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
	modImplementation("net.fabricmc.fabric-api:fabric-api:${fabric_api_version}")

	include(implementation("folk.sisby:kaleido-config:${kaleido_version}"))
	include(modImplementation("eu.pb4:placeholder-api:${papi_version}"))

	include(implementation("net.dv8tion:JDA:${jda_version}") {
		exclude module: 'opus-java'
	})
	include('com.fasterxml.jackson.core:jackson-core:2.21.2')
	include('com.fasterxml.jackson.core:jackson-annotations:2.21')
	include('com.fasterxml.jackson.core:jackson-databind:2.21.2')
	include('com.neovisionaries:nv-websocket-client:2.14')
	include('com.squareup.okhttp3:okhttp:5.3.2')
	include('com.squareup.okio:okio-jvm:3.17.0')
	include('net.sf.trove4j:core:3.1.0')
	include('org.apache.commons:commons-collections4:4.5.0')
	include('org.jetbrains.kotlin:kotlin-stdlib:1.9.25')
	include('org.slf4j:slf4j-api:2.0.17')
}

processResources {
	def version = project.version
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property 'projectName', projectName

	from('LICENSE') {
		rename { "${it}_$projectName" }
	}
}

// Configure the maven publication
publishing {
	publications {
		create('mavenJava', MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
