plugins {
	id 'fabric-loom' version '1.11-SNAPSHOT'
	id 'maven-publish'
}

version = "${project.mod_version}+${project.minecraft_version_base}+fabric"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url 'https://maven.nucleoid.xyz/' }
	maven { url 'https://repo.sleeping.town/' }
	mavenCentral()
}

loom {
	mods {
		"nilcord" {
			sourceSet("main")
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation include("eu.pb4:placeholder-api:${project.papi_version}")

	implementation include("net.dv8tion:JDA:${project.jda_version}") {
		exclude module: 'opus-java'
	}
	implementation include("folk.sisby:kaleido-config:${project.kaleido_version}")

	include("com.fasterxml.jackson.core:jackson-core:2.17.2")
	include("com.fasterxml.jackson.core:jackson-annotations:2.17.2")
	include("com.fasterxml.jackson.core:jackson-databind:2.17.2")
	include("com.neovisionaries:nv-websocket-client:2.14")
	include("com.squareup.okhttp3:okhttp:4.12.0")
	include("com.squareup.okio:okio-jvm:3.10.2")
	include("net.sf.trove4j:trove4j:3.0.3")
	include("org.apache.commons:commons-collections4:4.4")
	include("org.jetbrains.kotlin:kotlin-stdlib:1.9.25")
	include("org.slf4j:slf4j-api:2.0.13") // Use 2.0 instead of 1.0
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${base.archivesName.get()}" }
	}
}

// Configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
