apply from: 'gradle/scripts/helpers.gradle'

configurations {
    shade
}

repositories {
    maven { url 'https://repo.sleeping.town' }

    exclusiveContent {
        forRepository {
            maven {
                name 'CurseMaven'
                url 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name 'Modrinth'
                url 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }

    mavenLocal() // Must be last for caching to work
}

dependencies {
    shade implementation('net.dv8tion:JDA:5.3.2') {
        exclude module: 'opus-java'
    }
    shade implementation('folk.sisby:kaleido-config:0.3.3+1.3.2')
}